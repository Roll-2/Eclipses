<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Eclissi — 1900/2026</title>
<style>
:root{
  --bg:#0b0e14;
  --ui:#FF8C00;
  --paper:#F2F4F8;
  --line:rgba(255,255,255,.18);
  --line-soft:rgba(255,255,255,.10);
  /* FiraCode Nerd Font è installato con Homebrew (cask font-fira-code-nerd-font);
     le famiglie successive sono solo una riserva per altri sistemi. */
  --mono:"FiraCode Nerd Font","Fira Code",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --serif:"FiraCode Nerd Font","Fira Code",ui-monospace,"SFMono-Regular",Menlo,Consolas,serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--paper);overflow:hidden}
body{font-family:var(--mono);-webkit-font-smoothing:antialiased}
.atlas{position:relative;width:100vw;height:100svh;min-height:520px;overflow:hidden;background:var(--bg);isolation:isolate}
#sky{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%}
.panel{
  position:absolute;z-index:2;border:1px solid var(--line);
  background:rgba(11,14,20,.62);color:var(--paper);
}
.panel.active{
  border-color:var(--event-color);
  box-shadow:0 0 0 1px var(--event-color),0 0 22px -8px var(--event-color);
}
.date-panel{top:28px;left:28px;width:268px;padding:20px 18px 18px;z-index:3}
.date-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
.date-main{min-width:0;overflow:visible}
.month{
  display:block;margin:0 0 6px;
  font:400 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;
  color:rgba(242,244,248,.60);
}
.year-wrap{position:relative;display:flex;align-items:center;overflow:visible}
.year{
  appearance:none;-webkit-appearance:none;border:0;outline:0;background:transparent;
  color:var(--paper);font:500 42px/1.15 var(--mono);letter-spacing:-.02em;
  padding:2px 16px 2px 0;margin:0;cursor:pointer;width:4.8ch;min-width:4.8ch;text-align:left;
  height:auto;overflow:visible;
}
.year:focus-visible{outline:1px solid rgba(242,244,248,.60);outline-offset:3px}
.year-list{
  position:absolute;top:calc(100% + 6px);left:0;z-index:6;
  width:126px;max-height:266px;overflow-y:auto;margin:0;padding:4px 0;
  list-style:none;background:#0b0e14;border:1px solid rgba(255,255,255,.30);
  box-shadow:0 16px 34px -14px rgba(0,0,0,.85);
  font:400 15px/1 var(--mono);color:var(--paper);
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.30) transparent;
}
.year-list[hidden]{display:none}
.year-list li{padding:8px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.year-list li:hover{background:rgba(255,255,255,.07)}
.year-list li.is-active{background:rgba(255,255,255,.12)}
.year-list li[aria-selected="true"]{color:#FFFFFF;background:rgba(255,255,255,.20)}
.year-list::-webkit-scrollbar{width:8px}
.year-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.26)}
/* Centrato sull'inchiostro delle cifre, non sulla line box: con Fira Code
   i margini interni sono asimmetrici e il vecchio bottom:11px lo spostava. */
.chevron{position:absolute;right:0;top:46%;transform:translateY(-50%);font-size:9px;line-height:1;color:rgba(242,244,248,.55);pointer-events:none}
.play{
  flex:0 0 auto;display:grid;place-items:center;width:30px;height:30px;margin-bottom:1px;padding:0;
  border:1px solid rgba(255,140,0,.52);background:transparent;color:rgba(255,140,0,.92);
  font:400 11px/1 var(--mono);cursor:pointer;transition:border-color .14s,background .14s,color .14s;
}
.play:hover,.play:focus-visible{border-color:var(--ui);background:rgba(255,140,0,.10);color:var(--ui);outline:0}
.legend{display:grid;gap:7px;margin-top:13px}
.legend-item{
  display:grid;grid-template-columns:16px 1fr;align-items:center;gap:9px;
  font:400 9.5px/1.2 var(--mono);color:rgba(242,244,248,.86);letter-spacing:.015em;
}
.swatch{display:block;width:16px;height:1.5px;background:var(--c)}
.legend-item:last-child{margin-top:2px;padding-top:9px;border-top:1px solid var(--line-soft);color:rgba(242,244,248,.55);font-size:9px}
.chart-panel{top:28px;right:28px;width:302px;height:232px;padding:13px 15px 8px;display:flex;flex-direction:column}
.chart-head{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font:500 12.5px/1.15 var(--mono);letter-spacing:.005em;color:rgba(242,244,248,.92);
}
.chart-head span:last-child{
  font:400 8px/1.2 var(--mono);letter-spacing:.08em;color:rgba(242,244,248,.44);
  white-space:nowrap;
}
#chart{display:block;flex:1;width:100%;min-height:0;margin-top:5px;cursor:pointer;touch-action:manipulation}
.preview{padding:0;overflow:hidden;background:var(--bg)}
.moon-panel{left:28px;bottom:28px;width:260px;height:186px}
.sun-panel{right:28px;bottom:28px;width:260px;height:186px}
.preview-label{
  position:absolute;top:11px;left:13px;z-index:1;
  font:400 10.5px/1 var(--mono);letter-spacing:.20em;text-transform:uppercase;
  color:rgba(242,244,248,.66);pointer-events:none;
}
/* Solo la scritta del Sole resta d'accento. */
.sun-panel .preview-label{color:rgba(255,140,0,.76)}
.preview canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
@media (max-width:1100px){
  .date-panel{top:18px;left:18px;width:238px;padding:16px 15px 15px}
  .month{font-size:10px;letter-spacing:.19em}
  .year{font-size:36px;width:4.8ch}
  .play{width:27px;height:27px;font-size:10px}
  .legend{margin-top:11px;gap:5px}
  .legend-item{font-size:8.5px;grid-template-columns:13px 1fr;gap:7px}
  .swatch{width:13px;height:1.5px}
  .chart-panel{top:18px;right:18px;width:270px;height:208px;padding:11px 13px 7px}
  .chart-head{font-size:11.5px}
  .moon-panel{left:18px;bottom:18px;width:228px;height:164px}
  .sun-panel{right:18px;bottom:18px;width:228px;height:164px}
  .preview-label{top:9px;left:11px;font-size:10px}
}
@media (max-width:760px){
  .date-panel{top:10px;left:10px;width:198px;padding:13px 12px 12px}
  .month{font-size:8.5px;letter-spacing:.16em}
  .year{font-size:28px;width:5.2ch;min-width:5.2ch}
  .play{width:23px;height:23px;font-size:9px}
  .legend{margin-top:9px;gap:3.5px}
  .legend-item{font-size:7.2px;grid-template-columns:10px 1fr;gap:5px}
  .swatch{width:10px;height:1.5px}
  .chart-panel{top:10px;right:10px;width:208px;height:174px;padding:8px 9px 5px}
  .chart-head{font-size:9.5px}
  .chart-head span:last-child{font-size:6.5px}
  .moon-panel{left:10px;bottom:10px;width:166px;height:122px}
  .sun-panel{right:10px;bottom:10px;width:166px;height:122px}
  .preview-label{top:6px;left:8px;font-size:8px}
}
@media (max-width:480px){
  .date-panel{width:172px}
  .year{font-size:24px}
  .play{width:21px;height:21px;font-size:8px}
  /* A questa larghezza l'intervallo non ci sta accanto al titolo in Fira. */
  .chart-head span:last-child{display:none}
  .chart-panel{width:176px;height:154px}
  .moon-panel,.sun-panel{width:142px;height:104px}
}
</style>
</head>
<body>
<main class="atlas">
  <canvas id="sky" aria-label="Mappa eliocentrica di Sole, Terra, Luna, mesi e stagioni delle eclissi"></canvas>

  <section class="panel date-panel" aria-label="Data, comandi e legenda">
    <div class="date-row">
      <div class="date-main">
        <span class="month" id="month">GENNAIO</span>
        <div class="year-wrap">
          <button id="yearBtn" class="year" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="yearList" aria-label="Anno della simulazione">2026</button>
          <span class="chevron" aria-hidden="true">▾</span>
          <ul id="yearList" class="year-list" role="listbox" aria-label="Anno della simulazione" tabindex="-1" hidden></ul>
        </div>
      </div>
      <button id="play" class="play" type="button" aria-label="Pausa" aria-keyshortcuts="P">‖</button>
    </div>
    <div class="legend" aria-label="Legenda dei tipi di eclissi">
      <div class="legend-item"><span class="swatch" style="--c:#FFD700"></span><span>Solare totale</span></div>
      <div class="legend-item"><span class="swatch" style="--c:#FF0000"></span><span>Solare anulare</span></div>
      <div class="legend-item"><span class="swatch" style="--c:#00FFFF"></span><span>Solare parziale</span></div>
      <div class="legend-item"><span class="swatch" style="--c:#8A2BE2"></span><span>Lunare totale</span></div>
      <div class="legend-item"><span class="swatch" style="--c:#FF69B4"></span><span>Lunare parziale</span></div>
      <div class="legend-item"><span class="swatch" style="--c:#FF8C00;height:4px"></span><span>Stagione delle eclissi</span></div>
    </div>
  </section>

  <section class="panel chart-panel" aria-label="Numero di eclissi solari per anno dal 1900 al 2026">
    <div class="chart-head"><span>Eclissi solari per anno</span><span>1900—2026</span></div>
    <canvas id="chart" aria-label="Grafico a barre della frequenza annuale: 2, 3, 4 e 5 eclissi solari; cliccare una colonna seleziona un anno"></canvas>
  </section>

  <section class="panel preview moon-panel" id="moonPanel" aria-label="Anteprima dell'eclissi lunare">
    <span class="preview-label">Luna</span>
    <canvas id="moonView" aria-label="La Luna vista in primo piano"></canvas>
  </section>

  <section class="panel preview sun-panel" id="sunPanel" aria-label="Anteprima dell'eclissi solare">
    <span class="preview-label">Sole</span>
    <canvas id="sunView" aria-label="Il Sole visto in primo piano"></canvas>
  </section>
</main>

/* Ellisse volutamente eccentrica: il Sole sta in un fuoco.
   Con e = 0,22 la distanza Terra–Sole varia di circa il 56% fra perielio
   e afelio; è una mappa schematica, non in scala. */
const ECC = 0.22;
const PERIHELION_DAY = 3;
const ORBIT_A = 300;
const NODE_HALF_DAYS = 21.5;

/* Orbita lunare disegnata con eccentricità volutamente accentuata, come
   l'ellisse terrestre: la Terra sta in un fuoco, non al centro. La
   direzione della Luna resta quella usata per le eclissi, quindi gli
   allineamenti non cambiano; varia solo la distanza lungo l'orbita. */
const MOON_ECC = 0.32;
const MOON_PERIGEE = 2.1;

function moonOrbitRadius(phi, a) {
  return a * (1 - MOON_ECC * MOON_ECC) / (1 + MOON_ECC * Math.cos(phi - MOON_PERIGEE));
}

/* Stesse tinte, schiarite verso il bianco: sul fondo #0b0e14 le versioni
   pure (rosso e viola in particolare) restavano quasi invisibili. */
function brightenColor(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const mix = (c) => Math.round(c + (255 - c) * amount);
  return `rgb(${mix((n >> 16) & 255)},${mix((n >> 8) & 255)},${mix(n & 255)})`;
}
const LINE_COLOR = {

  solar_annular: '#FF1A1A'
};

function dayIndex(e) {
  let d = e.day;
  for (let i = 0; i < e.month - 1; i++) d += MONTH_DAYS[i];
  return d - 1;
}

function dateFromDay(value) {
  let rem = Math.max(0, Math.min(364, Math.floor(value)));
  let month = 0;
  while (rem >= MONTH_DAYS[month]) {
    rem -= MONTH_DAYS[month];
    month++;
  }
  return { month, day: rem + 1 };
}

/* Eventi indicizzati per anno, già ordinati per giorno dell'anno. */
const eventsByYear = new Map();
for (const e of eclipseData) {
  if (!eventsByYear.has(e.year)) eventsByYear.set(e.year, []);
  eventsByYear.get(e.year).push({ ...e, di: dayIndex(e) });
}
for (const list of eventsByYear.values()) list.sort((a, b) => a.di - b.di);

/* Frequenza annuale delle eclissi solari (usata dal grafico). */
const solarPerYear = new Map();
for (const e of eclipseData) {
  if (!e.type.startsWith('solar_')) continue;
  solarPerYear.set(e.year, (solarPerYear.get(e.year) || 0) + 1);
}
const freqCounts = [2, 3, 4, 5].map((n) => [...solarPerYear.values()].filter((v) => v === n).length);

/* ------------------------------------------------------------------
   Orbita terrestre.

   Il moto è risolto con l'equazione di Keplero a partire dall'anomalia
   media M, così la velocità angolare cresce al perielio e cala all'afelio.
   L'ellisse è disegnata con il Sole in un fuoco: nel canvas il Sole resta
   al centro, il centro geometrico dell'orbita è spostato a sinistra.
   ------------------------------------------------------------------ */
function solveKepler(M) {
  M = ((M % TAU) + TAU) % TAU;
  let E = M;
  for (let i = 0; i < 8; i++) {
    E -= (E - ECC * Math.sin(E) - M) / (1 - ECC * Math.cos(E));
  }
  return E;
}

function earthStateFromM(M) {
  const E = solveKepler(M);
  const nu = Math.atan2(Math.sqrt(1 - ECC * ECC) * Math.sin(E), Math.cos(E) - ECC);
  return { M, E, nu, r: 1 - ECC * Math.cos(E) };
}

function earthState(day) {
  return earthStateFromM(TAU * (day - PERIHELION_DAY) / DAYS_IN_YEAR);
}

/* ------------------------------------------------------------------
   Fase lunare continua.

   La fase viene misurata rispetto alla direzione Sole–Terra (non in
   coordinate assolute): in questo modo la velocità relativa resta quella
   sinodica e la Luna non rallenta né torna indietro. Agli eventi del
   catalogo la fase è fissata a 0 (congiunzione, eclissi solare) o π
   (opposizione, eclissi lunare); fra un evento e l'altro è interpolata.
   ------------------------------------------------------------------ */
const SYNODIC_DAYS = 29.53059;
const SYNODIC_RATE_YEAR = TAU * DAYS_IN_YEAR / SYNODIC_DAYS;

const moonAnchors = (() => {
  const ordered = [];
  for (const list of eventsByYear.values()) ordered.push(...list);
  ordered.sort((a, b) => (a.year * 365 + a.di) - (b.year * 365 + b.di));

  const out = [];
  for (const e of ordered) {
    const t = e.year + e.di / DAYS_IN_YEAR;
    let phase = e.type.startsWith('lunar_') ? Math.PI : 0;
    if (out.length) {
      const prev = out[out.length - 1];
      const predicted = prev.phase + (t - prev.t) * SYNODIC_RATE_YEAR;
      phase += TAU * Math.round((predicted - phase) / TAU);
    }
    out.push({ t, phase });
  }
  return out;
})();

function moonPhaseAt(t) {
  if (!moonAnchors.length) return 0;
  const first = moonAnchors[0];
  const last = moonAnchors[moonAnchors.length - 1];
  if (t <= first.t) return first.phase + (t - first.t) * SYNODIC_RATE_YEAR;
  if (t >= last.t) return last.phase + (t - last.t) * SYNODIC_RATE_YEAR;
  let lo = 0;
  let hi = moonAnchors.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (moonAnchors[mid].t <= t) lo = mid;
    else hi = mid;
  }
  const A = moonAnchors[lo];
  const B = moonAnchors[hi];
  const f = (t - A.t) / (B.t - A.t || 1);
  return A.phase + (B.phase - A.phase) * f;
}

/* Direzione geocentrica del Sole: opposta al raggio vettore della Terra. */
function sunDirection(day) {
  return earthState(day).nu + Math.PI;
}

function moonAbsoluteAngle(t) {
  const day = ((t % 1) + 1) % 1 * DAYS_IN_YEAR;
  return sunDirection(day) + moonPhaseAt(t);
}

/* Regressione dei nodi ricavata dal catalogo 1900–2026.
   È espressa nell'anomalia media, la stessa coordinata usata per le bande;
   la fase è traslata dell'offset del perielio rispetto al 1° gennaio. */
const NODE_EPOCH_A = 24.338221378827825 * Math.PI / 180;
const NODE_RATE = -19.35051210314555 * Math.PI / 180;
const NODE_EPOCH = NODE_EPOCH_A - TAU * PERIHELION_DAY / DAYS_IN_YEAR;
const nodeAt = (t) => NODE_EPOCH + NODE_RATE * (t - 2000);

const sunPanel = document.getElementById('sunPanel');

const stars = Array.from({ length: 15 }, () => ({ x: Math.random(), y: Math.random() }));

let simYear = START_YEAR;
let playing = true;
let lastTime = performance.now();
let hoverBin = -1;
let lastGlowKey = null;
let lastUiYear = null;
let lastUiMonth = null;
let lastChartYear = null;

let holdUntil = 0;
let heldYear = START_YEAR;
const heldSet = new Set();

let skyView = { w: 0, h: 0, ctx: sky.getContext('2d') };
let chartView = { w: 0, h: 0, ctx: chart.getContext('2d') };
let moonView = { w: 0, h: 0, ctx: moonCanvas.getContext('2d') };
let sunView = { w: 0, h: 0, ctx: sunCanvas.getContext('2d') };
let chartPlot = { left: 0, right: 0, top: 0, bottom: 0 };

function fitCanvas(canvas, previous) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(1, rect.width);
  const h = Math.max(1, rect.height);
  const bw = Math.round(w * dpr);
  const bh = Math.round(h * dpr);
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw;
    canvas.height = bh;
  }
  const ctx = previous && previous.ctx ? previous.ctx : canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w, h, ctx };
}

function resizeAll() {
  skyView = fitCanvas(sky, skyView);
  chartView = fitCanvas(chart, chartView);
  moonView = fitCanvas(moonCanvas, moonView);
  sunView = fitCanvas(sunCanvas, sunView);
  drawChart();
}

function getActiveEvent(events, day) {
  for (const e of events) {
    if (day >= e.di - EVENT_HALF && day <= e.di + EVENT_HALF) return e;
  }
  return null;
}

function updateGlow(active) {
  const key = active ? `${active.year}-${active.month}-${active.day}-${active.type}` : '';
  if (key === lastGlowKey) return;
  lastGlowKey = key;
  for (const [panel, kind] of [[moonPanel, 'lunar_'], [sunPanel, 'solar_']]) {
    const on = !!active && active.type.startsWith(kind);
    panel.classList.toggle('active', on);
    if (on) panel.style.setProperty('--event-color', TYPE_COLOR[active.type]);
    else panel.style.removeProperty('--event-color');
  }
}

function drawMonthTicks(ctx, cx, cy, aPx, bPx, eCx, S) {
  for (const start of MONTH_STARTS) {
    /* Il 1° gennaio segna l'inizio e la fine dell'anno: più lungo
       (sporge oltre il disco della Terra), rosso e con un alone. */
    const january = start === 0;
    const st = earthState(start);
    const px = cx + aPx * st.r * Math.cos(st.nu);
    const py = cy - aPx * st.r * Math.sin(st.nu);
    let nx = (px - eCx) / aPx;
    let ny = (py - cy) / bPx;
    const len = Math.hypot(nx, ny) || 1;
    nx /= len;
    ny /= len;
    const d = (january ? 15 : 4.5) * S;
    ctx.save();
    if (january) {
      ctx.strokeStyle = '#FF2020';
      ctx.lineWidth = Math.max(1.5, 2.6 * S);
      ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(255,32,32,.55)';
      ctx.shadowBlur = 7 * S;
    } else {
      ctx.strokeStyle = 'rgba(255,140,0,.40)';
      ctx.lineWidth = Math.max(0.8, 0.9 * S);
      ctx.lineCap = 'butt';
    }
    ctx.beginPath();
    ctx.moveTo(px - nx * d, py - ny * d);
    ctx.lineTo(px + nx * d, py + ny * d);
    ctx.stroke();
    ctx.restore();
  }
}

function drawMonthLabels(ctx, cx, cy, aPx, bPx, eCx, S) {
  const fs = Math.max(6.5, 8 * S);
  const off = 20 * S;
  ctx.font = `500 ${fs}px ${MONO}`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0.12em';
  ctx.lineJoin = 'round';
  for (let m = 0; m < 12; m++) {
    const mid = MONTH_STARTS[m] + MONTH_DAYS[m] / 2;
    const st = earthState(mid);
    const px = cx + aPx * st.r * Math.cos(st.nu);
    const py = cy - aPx * st.r * Math.sin(st.nu);
    let nx = (px - eCx) / aPx;
    let ny = (py - cy) / bPx;
    const len = Math.hypot(nx, ny) || 1;
    nx /= len;
    ny /= len;

    let align = 'center';
    let baseline = 'middle';
    if (nx > 0.42) align = 'left';
    else if (nx < -0.42) align = 'right';
    else baseline = ny < 0 ? 'bottom' : 'top';

    const lx = px + nx * off;
    const ly = py + ny * off;
    const label = MONTH_NAMES[m];

    ctx.textAlign = align;
    ctx.textBaseline = baseline;
    ctx.lineWidth = Math.max(2, 2.6 * S);
    ctx.strokeStyle = BG;
    ctx.strokeText(label, lx, ly);
    ctx.fillStyle = 'rgba(255,140,0,.62)';
    ctx.fillText(label, lx, ly);
  }
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
}

function drawSky(year, day, active) {
  const { w, h, ctx } = skyView;
  if (w < 2 || h < 2) return;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, w, h);

  ctx.fillStyle = '#FFFFFF';
  ctx.globalAlpha = 0.72;
  for (const s of stars) ctx.fillRect(Math.floor(s.x * w), Math.floor(s.y * h), 1, 1);
  ctx.globalAlpha = 1;

  const cx = w / 2;
  const cy = h / 2;
  const S = Math.min(1, w / 1200, h / 800);
  const aPx = ORBIT_A * S;
  const bPx = aPx * Math.sqrt(1 - ECC * ECC);
  const eCx = cx - aPx * ECC;
  const lunarR = 58 * S;
  const earthR = 9 * S;
  const moonR = Math.max(2, 3.6 * S);

  const st = earthState(day);
  const ex = cx + aPx * st.r * Math.cos(st.nu);
  const ey = cy - aPx * st.r * Math.sin(st.nu);

  /* Orbita terrestre */
  ctx.beginPath();
  ctx.ellipse(eCx, cy, aPx, bPx, 0, 0, TAU);
  ctx.strokeStyle = 'rgba(255,255,255,.52)';
  ctx.lineWidth = Math.max(0.9, 1 * S);
  ctx.stroke();

  /* Stagioni delle eclissi: bande che regrediscono di 19,35°/anno */
  const node = nodeAt(simYear);
  const half = NODE_HALF_DAYS * TAU / DAYS_IN_YEAR;
  ctx.strokeStyle = UI;
  ctx.lineWidth = Math.max(2.5, 4 * S);
  ctx.lineCap = 'butt';
  ctx.globalAlpha = 0.92;
  for (const center of [node, node + Math.PI]) {
    ctx.beginPath();
    for (let i = 0; i <= 72; i++) {
      const M = center - half + (2 * half) * i / 72;
      const s = earthStateFromM(M);
      const x = cx + aPx * s.r * Math.cos(s.nu);
      const y = cy - aPx * s.r * Math.sin(s.nu);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* Confini dei mesi, con lunghezze reali */
  drawMonthTicks(ctx, cx, cy, aPx, bPx, eCx, S);

  /* Linee di allineamento delle eclissi già avvenute nell'anno */
  const events = eventsByYear.get(year) || [];
  ctx.save();
  ctx.setLineDash([Math.max(3, 4.5 * S), Math.max(3, 4.5 * S)]);
  ctx.lineWidth = Math.max(1.1, 1.35 * S);
  for (const e of events) {
    if (day < e.di - EVENT_HALF) continue;
    const es = earthState(e.di);
    const px = cx + aPx * es.r * Math.cos(es.nu);
    const py = cy - aPx * es.r * Math.sin(es.nu);
    const dx = px - cx;
    const dy = py - cy;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len;
    const uy = dy / len;
    const isActive = active && active.year === e.year && active.month === e.month && active.day === e.day && active.type === e.type;
    ctx.strokeStyle = LINE_COLOR[e.type] || UI;
    ctx.globalAlpha = isActive ? 1 : 0.62;
    ctx.shadowColor = LINE_COLOR[e.type] || UI;
    ctx.shadowBlur = isActive ? 10 * S : 4 * S;
    /* Solari: si fermano alla Terra. Lunari: proseguono oltre la Terra
       fino alla Luna, che all'opposizione sta sul lato notturno. */
    const lunar = e.type.startsWith('lunar_');
    const over = lunar
      ? moonOrbitRadius(moonAbsoluteAngle(e.year + e.di / DAYS_IN_YEAR), lunarR) + 8 * S
      : 0;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(px + ux * over, py + uy * over);
    ctx.stroke();
  }
  ctx.restore();

  /* Orbita lunare: ellisse con la Terra in un fuoco */
  ctx.beginPath();
  ctx.ellipse(
    ex - lunarR * MOON_ECC * Math.cos(MOON_PERIGEE),
    ey + lunarR * MOON_ECC * Math.sin(MOON_PERIGEE),
    lunarR,
    lunarR * Math.sqrt(1 - MOON_ECC * MOON_ECC),
    -MOON_PERIGEE,
    0, TAU
  );
  ctx.strokeStyle = 'rgba(208,212,220,.52)';
  ctx.lineWidth = Math.max(0.9, 0.9 * S);
  ctx.stroke();

  /* Sole, al fuoco dell'ellisse */
  const sunR = 24 * S;
  ctx.save();
  ctx.shadowColor = 'rgba(255,140,0,.30)';
  ctx.shadowBlur = 16 * S;
  const sg = ctx.createRadialGradient(cx - sunR * 0.24, cy - sunR * 0.27, sunR * 0.08, cx, cy, sunR * 1.04);
  sg.addColorStop(0, '#FFE0B0');
  sg.addColorStop(0.36, '#FFB35C');
  sg.addColorStop(0.82, UI);
  sg.addColorStop(1, '#C95E00');
  ctx.beginPath();
  ctx.arc(cx, cy, sunR, 0, TAU);
  ctx.fillStyle = sg;
  ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(cx, cy, sunR, 0, TAU);
  ctx.strokeStyle = 'rgba(255,205,150,.32)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* Terra */
  ctx.beginPath();
  ctx.arc(ex, ey, earthR, 0, TAU);
  ctx.fillStyle = '#7D9BB3';
  ctx.fill();
  ctx.strokeStyle = 'rgba(190,220,245,.48)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* Luna: fase relativa al Sole, quindi sempre in moto progrado.
     La distanza segue l'ellisse, con la Terra in un fuoco. */
  const ma = moonAbsoluteAngle(simYear);
  const moonDist = moonOrbitRadius(ma, lunarR);
  const mx = ex + moonDist * Math.cos(ma);
  const my = ey - moonDist * Math.sin(ma);
  ctx.beginPath();
  ctx.arc(mx, my, moonR, 0, TAU);
  ctx.fillStyle = '#E8EDF5';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.40)';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  /* Anello dell'evento attivo */
  if (active && TYPE_COLOR[active.type]) {
    const col = TYPE_COLOR[active.type];
    ctx.save();
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(1.2, 1.6 * S);
    ctx.shadowColor = col;
    ctx.shadowBlur = 8 * S;
    ctx.beginPath();
    ctx.arc(mx, my, Math.max(7, 10 * S), 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  drawMonthLabels(ctx, cx, cy, aPx, bPx, eCx, S);
}

function drawMoonPreview(t, active) {
  const { w, h, ctx } = moonView;
  if (w < 2 || h < 2) return;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;
  const R = Math.min(w, h) * 0.32 * moonSizeFactor(t);
  const lunar = !!(active && active.type.startsWith('lunar_'));
  const color = lunar ? TYPE_COLOR[active.type] : null;
  const total = lunar && active.type === 'lunar_total';
  const partial = lunar && active.type === 'lunar_partial';

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.clip();

  if (total) {
    const g = ctx.createRadialGradient(cx - R * 0.22, cy - R * 0.24, R * 0.08, cx, cy, R * 1.02);
    g.addColorStop(0, '#2B143D');
    g.addColorStop(0.62, '#150B20');
    g.addColorStop(1, '#05030A');
    ctx.fillStyle = g;
    ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = color;
    ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    ctx.globalAlpha = 1;
  } else {
    const g = ctx.createRadialGradient(cx - R * 0.28, cy - R * 0.30, R * 0.06, cx, cy, R * 1.04);
    g.addColorStop(0, '#FFFFFF');
    g.addColorStop(0.52, '#E6ECF3');
    g.addColorStop(1, '#A9B5C4');
    ctx.fillStyle = g;
    ctx.fillRect(cx - R, cy - R, R * 2, R * 2);

    if (partial) {
      const sx = cx + R * 0.58;
      const sy = cy - R * 0.06;
      const sg = ctx.createRadialGradient(sx, sy, R * 0.18, sx, sy, R * 1.12);
      sg.addColorStop(0, 'rgba(8,4,15,.98)');
      sg.addColorStop(0.72, 'rgba(22,11,34,.96)');
      sg.addColorStop(1, 'rgba(22,11,34,.78)');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.arc(sx, sy, R * 1.08, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 0.14;
      ctx.fillStyle = color;
      ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  if (lunar) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.40)';
    ctx.lineWidth = 1;
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
}

/* Corona del 1999 (fotografia), ridimensionata e sfumata verso il fondo.
   Il disco nero dell'immagine misura 1/1,7 del lato ritagliato. */

const coronaImg = new Image();
coronaImg.src = CORONA_SRC;

/* Easter egg: le due eclissi totali viste dall'autore (USA 2017 e
   Spagna 2026). Sono gli originali, byte per byte: nessun ritaglio,
   nessun filtro, nessun ridimensionamento a monte. */
const CORONA_EGG = {
  '2017-8-21': EGG_USA_2017,
  '2026-8-12': EGG_SPAIN_2026
};
const coronaEggs = new Map();
for (const [key, src] of Object.entries(CORONA_EGG)) {
  if (!src) continue;
  const img = new Image();
  img.src = src;
  coronaEggs.set(key, img);
}

/* Trattamento speciale per le due foto personali: la fotografia viene
   mostrata intera, senza che il disco della Luna calcolato la copra. */
function eggPhoto(active) {
  const own = active && coronaEggs.get(`${active.year}-${active.month}-${active.day}`);
  return own && own.complete && own.naturalWidth ? own : null;
}

/* Variazione del diametro apparente della Luna: ±5,5% fra perigeo e apogeo.
   La fase è quella dell'orbita disegnata sulla mappa (perigeo verso
   MOON_PERIGEE), così la Luna appare più grande quando è realmente più
   vicina alla Terra e più piccola all'apogeo. */
function moonSizeFactor(t) {
  return 1 + 0.055 * Math.cos(moonAbsoluteAngle(t) - MOON_PERIGEE);
}

/* Corona solare reale (eclissi totale del 1999), ritagliata a 1,7 raggi
   lunari e sfumata verso il fondo del pannello. Il disco nero della foto
   coincide con il disco della Luna, così i due si sovrappongono. */
function drawCorona(ctx, cx, cy, moonR) {
  if (coronaImg.complete && coronaImg.naturalWidth) {
    const size = moonR * 2 * CORONA_CROP;
    ctx.drawImage(coronaImg, cx - size / 2, cy - size / 2, size, size);
    return;
  }
  /* Riserva finché la fotografia non è decodificata. */
  const g = ctx.createRadialGradient(cx, cy, moonR, cx, cy, moonR * CORONA_CROP);
  g.addColorStop(0, 'rgba(255,242,220,.55)');
  g.addColorStop(0.4, 'rgba(255,214,170,.18)');
  g.addColorStop(1, 'rgba(255,180,90,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, moonR * CORONA_CROP, 0, TAU);
  ctx.fillStyle = g;
  ctx.fill();
}

function drawSunPreview(t, active) {
  const { w, h, ctx } = sunView;
  if (w < 2 || h < 2) return;

  const day = ((t % 1) + 1) % 1 * DAYS_IN_YEAR;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;

  const solar = !!(active && active.type.startsWith('solar_'));
  const total = solar && active.type === 'solar_total';

  /* Easter egg: per le due totalità fotografate dall'autore (USA 2017 e
     12 agosto 2026 in Spagna) la fotografia dell'evento viene appoggiata sopra
     la grafica normale, intera e senza ritagli né ritocchi (è già quadrata). */
  const egg = total ? (active.year !== 2017 && active.year !== 2026 ? eggPhoto(active) : null) : null

  /* Il Sole varia del 7% fra perielio e afelio: la preview resta fedele,
     mentre la mappa è volutamente schematica. */
  const sunDistFactor = 1 + 0.0338 * Math.cos(TAU * (day - PERIHELION_DAY) / DAYS_IN_YEAR);
  const sunR = Math.min(w, h) * 0.30 * sunDistFactor;

  /* La Luna parte quasi uguale al Sole e oscilla con la propria eccentricità. */
  const baseMoonR = sunR * 0.98;
  let moonR = baseMoonR * moonSizeFactor(t);

  /* Il catalogo NASA resta la verità: quando l'approssimazione della distanza
     lunare contraddice il tipo di eclissi, la Luna viene corretta. */
  if (solar && active.type === 'solar_annular') moonR = Math.min(moonR, sunR * 0.92);
  if (total) moonR = Math.max(moonR, sunR * 1.05);

  /* Durante la totalità la fotosfera è coperta: al suo posto si vede la corona. */
  if (total) drawCorona(ctx, cx, cy, moonR);

  if (!total) {
    ctx.save();
    ctx.shadowColor = 'rgba(255,140,0,.42)';
    ctx.shadowBlur = sunR * 0.45;
    const g = ctx.createRadialGradient(cx - sunR * 0.22, cy - sunR * 0.25, sunR * 0.08, cx, cy, sunR * 1.02);
    g.addColorStop(0, '#FFF1D6');
    g.addColorStop(0.42, '#FFC46B');
    g.addColorStop(0.86, UI);
    g.addColorStop(1, '#D96A00');
    ctx.beginPath();
    ctx.arc(cx, cy, sunR, 0, TAU);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(cx, cy, sunR, 0, TAU);
    ctx.strokeStyle = 'rgba(255,225,180,.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  if (solar) {
    let ox = 0;
    let oy = 0;
    if (active.type === 'solar_partial') {
      ox = sunR * 0.6;
      oy = -sunR * 0.10;
    }
    ctx.beginPath();
    ctx.arc(cx + ox, cy + oy, moonR, 0, TAU);
    ctx.fillStyle = '#05070A';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,215,120,.14)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  if (egg) {
    const side = Math.min(w, h);
    ctx.drawImage(egg, cx - side / 2, cy - side / 2, side, side);
  }
}

function drawChart() {
  const { w, h, ctx } = chartView;
  if (w < 2 || h < 2) return;

  ctx.clearRect(0, 0, w, h);

  const left = 20;
  const right = w - 7;
  const top = 22;
  const bottom = h - 31;
  const plotW = Math.max(1, right - left);
  const plotH = Math.max(1, bottom - top);
  const yMax = 110;
  chartPlot = { left, right, top, bottom };

  const currentYear = Math.floor(simYear);
  const selectedBin = BIN_YEARS.findIndex((b) => b.year === currentYear);

  ctx.beginPath();
  ctx.moveTo(left, bottom);
  ctx.lineTo(right, bottom);
  ctx.strokeStyle = 'rgba(242,244,248,.22)';
  ctx.lineWidth = 1;
  ctx.stroke();

  const binW = plotW / 4;
  for (let i = 0; i < 4; i++) {
    const binLeft = left + binW * i;
    const count = freqCounts[i];
    const barH = Math.max(1.5, (count / yMax) * plotH);
    const barW = Math.min(binW * 0.48, 34);
    const x = binLeft + (binW - barW) / 2;
    const y = bottom - barH;
    const selected = i === selectedBin;

    if (hoverBin === i) {
      ctx.fillStyle = 'rgba(242,244,248,.035)';
      ctx.fillRect(binLeft + 1, top - 8, binW - 2, bottom - top + 8);
    }

    ctx.fillStyle = selected ? UI : 'rgba(255,140,0,.42)';
    ctx.fillRect(x, y, barW, barH);
    if (selected) {
      ctx.strokeStyle = 'rgba(255,140,0,.85)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, barW - 1, barH - 1);
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font = `500 9px ${MONO}`;
    ctx.fillStyle = selected ? UI : 'rgba(255,140,0,.66)';
    ctx.fillText(String(count), x + barW / 2, Math.max(9, y - 6));

    ctx.font = `400 15px ${MONO}`;
    ctx.fillStyle = selected ? PAPER + '.92)' : PAPER + '.42)';
    ctx.fillText(String(BIN_YEARS[i].n), binLeft + binW / 2, bottom + 17);
  }

  ctx.font = `400 7px ${MONO}`;
  ctx.fillStyle = PAPER + '.36)';
  ctx.textAlign = 'center';
  ctx.fillText('numero di eclissi solari nell’anno', w / 2, h - 3);
}

function updateDateUi(year, day) {
  if (year !== lastUiYear) {
    yearBtn.textContent = String(year);
    if (yearOpen) paintYearList(year, year);
    lastUiYear = year;
  }
  const date = dateFromDay(day);
  if (date.month !== lastUiMonth) {
    monthEl.textContent = MONTH_NAMES[date.month];
    lastUiMonth = date.month;
  }
}

function eventKey(e) {
  return `${e.year}-${e.month}-${e.day}-${e.type}`;
}

function crossingEvent(prev, next) {
  const year = Math.floor(prev);
  const events = eventsByYear.get(year) || [];
  for (const e of events) {
    const t = e.year + e.di / DAYS_IN_YEAR;
    if (t >= prev - 1e-9 && t <= next + 1e-9 && !heldSet.has(eventKey(e))) {
      return { e, t };
    }
  }
  return null;
}

function advance(now, dt) {
  if (now < holdUntil) return;

  const prev = simYear;
  let next = simYear + dt / YEAR_SECONDS;
  const crossing = crossingEvent(prev, next);

  if (crossing) {
    simYear = crossing.t;
    heldSet.add(eventKey(crossing.e));
    holdUntil = now + HOLD_MS;
    return;
  }

  simYear = next;
  if (simYear >= YEAR_MAX + 1) {
    simYear -= (YEAR_MAX + 1 - YEAR_MIN);
  }
  const year = Math.floor(simYear);
  if (year !== heldYear) {
    heldYear = year;
    heldSet.clear();
  }
}

function frame(now) {
  const dt = Math.min(0.25, Math.max(0, (now - lastTime) / 1000));
  lastTime = now;

  if (playing) advance(now, dt);

  const year = Math.floor(simYear);
  const day = (simYear - year) * DAYS_IN_YEAR;
  const events = eventsByYear.get(year) || [];
  const active = getActiveEvent(events, day);

  updateGlow(active);
  drawSky(year, day, active);
  drawMoonPreview(simYear, active);
  drawSunPreview(simYear, active);
  updateDateUi(year, day);
  if (year !== lastChartYear) {
    lastChartYear = year;
    drawChart();
  }

  requestAnimationFrame(frame);
}

function selectYear(year, restart = true) {
  simYear = Math.min(YEAR_MAX, Math.max(YEAR_MIN, year));
  holdUntil = 0;
  heldSet.clear();
  heldYear = Math.floor(simYear);
  if (restart) {
    lastGlowKey = null;
    lastUiYear = null;
    lastUiMonth = null;
    lastChartYear = null;
  }
}

/* Tendina dell'anno: lista compatta al posto del menu nativo del browser,
   che su macOS veniva disegnato dal sistema con il font da 42px. */
let yearOpen = false;
let yearActive = START_YEAR;

function yearOption(y) {
  return yearList.children[y - YEAR_MIN];
}

function paintYearList(selected, active) {
  yearActive = active;
  for (let y = YEAR_MIN; y <= YEAR_MAX; y++) {
    const item = yearOption(y);
    item.setAttribute('aria-selected', y === selected ? 'true' : 'false');
    item.classList.toggle('is-active', y === active);
  }
  yearList.setAttribute('aria-activedescendant', `year-${active}`);
}

function openYears() {
  yearOpen = true;
  yearList.hidden = false;
  yearBtn.setAttribute('aria-expanded', 'true');
  const current = Math.min(YEAR_MAX, Math.max(YEAR_MIN, Math.floor(simYear)));
  paintYearList(current, current);
  const item = yearOption(current);
  if (item) item.scrollIntoView({ block: 'center' });
  yearList.focus({ preventScroll: true });
}

function closeYears(focusButton = false) {
  if (!yearOpen) return;
  yearOpen = false;
  yearList.hidden = true;
  yearBtn.setAttribute('aria-expanded', 'false');
  if (focusButton) yearBtn.focus();
}

function chooseYear(y) {
  selectYear(y);
  updateDateUi(y, 0);
  closeYears(true);
}

yearBtn.addEventListener('click', () => {
  if (yearOpen) closeYears();
  else openYears();
});

yearList.addEventListener('pointerdown', (ev) => {
  const item = ev.target.closest('li[role="option"]');
  if (!item) return;
  ev.preventDefault();
  chooseYear(Number(item.dataset.year));
});

yearList.addEventListener('keydown', (ev) => {
  let next = null;
  if (ev.key === 'ArrowDown') next = Math.min(YEAR_MAX, yearActive + 1);
  else if (ev.key === 'ArrowUp') next = Math.max(YEAR_MIN, yearActive - 1);
  else if (ev.key === 'PageDown') next = Math.min(YEAR_MAX, yearActive + 10);
  else if (ev.key === 'PageUp') next = Math.max(YEAR_MIN, yearActive - 10);
  else if (ev.key === 'Home') next = YEAR_MIN;
  else if (ev.key === 'End') next = YEAR_MAX;
  else if (ev.key === 'Enter' || ev.key === ' ') {
    ev.preventDefault();
    chooseYear(yearActive);
    return;
  } else if (ev.key === 'Escape') {
    ev.preventDefault();
    closeYears(true);
    return;
  } else if (ev.key === 'Tab') {
    closeYears();
    return;
  }
  if (next === null) return;
  ev.preventDefault();
  paintYearList(Math.min(YEAR_MAX, Math.floor(simYear)), next);
  const item = yearOption(next);
  if (item) item.scrollIntoView({ block: 'nearest' });
});

document.addEventListener('pointerdown', (ev) => {
  if (yearOpen && !ev.target.closest('.year-wrap')) closeYears();
});

function togglePlay() {
  playing = !playing;
  playEl.textContent = playing ? '‖' : '▶';
  playEl.setAttribute('aria-label', playing ? 'Pausa' : 'Riprendi');
}

playEl.addEventListener('click', togglePlay);

/* Il tasto P mette in pausa e riprende, come il pulsante. */
document.addEventListener('keydown', (ev) => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key !== 'p' && ev.key !== 'P') return;
  ev.preventDefault();
  togglePlay();
});

function binAt(clientX, clientY) {
  const rect = chart.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  if (x < chartPlot.left || x > chartPlot.right || y < chartPlot.top - 8 || y > chartPlot.bottom + 8) return -1;
  const binW = (chartPlot.right - chartPlot.left) / 4;
  return Math.max(0, Math.min(3, Math.floor((x - chartPlot.left) / binW)));
}

chart.addEventListener('pointermove', (ev) => {
  const i = binAt(ev.clientX, ev.clientY);
  if (i !== hoverBin) {
    hoverBin = i;
    drawChart();
  }
});

chart.addEventListener('pointerleave', () => {
  if (hoverBin !== -1) {
    hoverBin = -1;
    drawChart();
  }
});

chart.addEventListener('click', (ev) => {
  const i = binAt(ev.clientX, ev.clientY);
  if (i >= 0) selectYear(BIN_YEARS[i].year);
});

let resizeQueued = false;
window.addEventListener('resize', () => {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => {
    resizeQueued = false;
    resizeAll();
  });
});

resizeAll();
requestAnimationFrame(frame);
</script>
